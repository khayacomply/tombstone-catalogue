<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tombstone Catalogue — Imbaly Funeral Home</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    /* Ad-specific header overrides */
    .ad-header-text {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      color: #fff;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-decoration: none;
    }
    .site-header {
      background: rgba(31, 41, 51, 0.98) !important;
      border-bottom: 2px solid var(--color-gold);
    }
    .nav-container {
      justify-content: center;
    }
    /* Hide default nav elements completely */
    .main-nav, .nav-toggle {
      display: none !important;
    }
    
    /* ===== LIGHTBOX MODAL ===== */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 2rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .lightbox-modal.active {
      display: flex;
      opacity: 1;
    }
    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lightbox-close {
      position: absolute;
      top: -50px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 3rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.3s ease;
    }
    .lightbox-close:hover {
      color: var(--color-gold);
    }
    .lightbox-image-container {
      max-width: 100%;
      max-height: 70vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--color-gold);
      border-radius: 4px;
      background: #000;
    }
    .lightbox-image-container img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      transition: transform 0.3s ease;
      cursor: zoom-in;
    }
    .lightbox-controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .lightbox-btn {
      background: var(--color-dark);
      color: var(--color-gold);
      border: 1px solid var(--color-gold);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .lightbox-btn:hover {
      background: var(--color-gold);
      color: var(--color-dark);
    }
    .lightbox-info {
      text-align: center;
      margin-top: 1.5rem;
      color: #fff;
    }
    .lightbox-info h3 {
      color: #fff;
      font-size: 1.5rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container nav-container">
      <a href="tombstone-catalogue.html" class="ad-header-text">TOMBSTONES</a>
    </div>
  </header>

  <section class="page-hero">
    <div class="page-hero-content">
      <p class="section-eyebrow light">Our Craftsmanship</p>
      <h1>Tombstone Catalogue</h1>
      <p>Browse our selection of handcrafted memorials. Click on any image to view it in detail and zoom in.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="catalog-grid" id="tombstoneGrid">
        <!-- Items injected via script below -->
      </div>
    </div>
  </section>

  <footer class="site-footer" style="padding: 2rem 0; text-align: center;">
    <div class="container">
      <p style="color: #666; font-size: 0.85rem;">© 2026 Imbaly Funeral Home. All rights reserved.</p>
    </div>
  </footer>

  <!-- IMAGE LIGHTBOX MODAL -->
  <div class="lightbox-modal" id="lightboxModal" aria-hidden="true">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
      <div class="lightbox-image-container">
        <img id="lightboxImage" src="" alt="" />
      </div>
      <div class="lightbox-controls">
        <button id="zoomOut" class="lightbox-btn" aria-label="Zoom Out">−</button>
        <button id="resetZoom" class="lightbox-btn" aria-label="Reset Zoom">⟲</button>
        <button id="zoomIn" class="lightbox-btn" aria-label="Zoom In">+</button>
      </div>
      <div class="lightbox-info">
        <span class="img-ref-id" id="lightboxRefId" style="font-size: 1rem; padding: 0.4rem 0.8rem;"></span>
        <h3 id="lightboxTitle"></h3>
      </div>
    </div>
  </div>

  <script>
    // ===== TOMBSTONE CATALOGUE DATA =====
    const tombstoneItems = [
      { id: 1, refId: "IFH-01", title: "Grave Construction 01", category: "Standard", image: "images/catalog-01.jpg" },
      { id: 2, refId: "IFH-02", title: "Grave Construction 02", category: "Standard", image: "images/catalog-02.jpg" },
      { id: 3, refId: "IFH-03", title: "Grave Construction 03", category: "Standard", image: "images/catalog-03.jpg" },
      { id: 4, refId: "IFH-04", title: "Grave Construction 04", category: "Standard", image: "images/catalog-04.jpg" },
      { id: 5, refId: "IFH-05", title: "Grave Construction 05", category: "Standard", image: "images/catalog-05.jpg" },
      { id: 6, refId: "IFH-06", title: "Grave Construction 06", category: "Standard", image: "images/catalog-06.jpg" },
      { id: 7, refId: "IFH-07", title: "Grave Construction 07", category: "Standard", image: "images/catalog-07.jpg" },
      { id: 8, refId: "IFH-08", title: "Grave Construction 08", category: "Standard", image: "images/catalog-08.jpg" },
      { id: 9, refId: "IFH-09", title: "Grave Construction 09", category: "Standard", image: "images/catalog-09.jpg" },
      { id: 10, refId: "IFH-10", title: "Grave Construction 10", category: "Standard", image: "images/catalog-10.jpg" },
      { id: 11, refId: "IFH-11", title: "Grave Construction 11", category: "Premium", image: "images/catalog-11.jpg" },
      { id: 12, refId: "IFH-12", title: "Grave Construction 12", category: "Premium", image: "images/catalog-12.jpg" },
      { id: 13, refId: "IFH-13", title: "Grave Construction 13", category: "Premium", image: "images/catalog-13.jpg" },
      { id: 14, refId: "IFH-14", title: "Grave Construction 14", category: "Premium", image: "images/catalog-14.jpg" },
      { id: 15, refId: "IFH-15", title: "Grave Construction 15", category: "Premium", image: "images/catalog-15.jpg" },
      { id: 16, refId: "IFH-16", title: "Grave Construction 16", category: "Premium", image: "images/catalog-16.jpg" },
      { id: 17, refId: "IFH-17", title: "Grave Construction 17", category: "Premium", image: "images/catalog-17.jpg" },
      { id: 18, refId: "IFH-18", title: "Grave Construction 18", category: "Premium", image: "images/catalog-18.jpg" },
      { id: 19, refId: "IFH-19", title: "Grave Construction 19", category: "Premium", image: "images/catalog-19.jpg" },
      { id: 20, refId: "IFH-20", title: "Grave Construction 20", category: "Premium", image: "images/catalog-20.jpg" },
      { id: 21, refId: "IFH-21", title: "Grave Construction 21", category: "Premium", image: "images/catalog-21.jpg" },
      { id: 22, refId: "IFH-22", title: "Grave Construction 22", category: "Premium", image: "images/catalog-22.jpg" },
      { id: 23, refId: "IFH-23", title: "Grave Construction 23", category: "Premium", image: "images/catalog-23.jpg" },
      { id: 24, refId: "IFH-24", title: "Grave Construction 24", category: "Premium", image: "images/catalog-24.jpg" },
      { id: 25, refId: "IFH-25", title: "Grave Construction 25", category: "Premium", image: "images/catalog-25.jpg" },
      { id: 26, refId: "IFH-26", title: "Grave Construction 26", category: "Premium", image: "images/catalog-26.jpg" },
      { id: 27, refId: "IFH-27", title: "Grave Construction 27", category: "Premium", image: "images/catalog-27.jpg" },
      { id: 28, refId: "IFH-28", title: "Grave Construction 28", category: "Premium", image: "images/catalog-28.jpg" },
      { id: 29, refId: "IFH-29", title: "Grave Construction 29", category: "Premium", image: "images/catalog-29.jpg" },
      { id: 30, refId: "IFH-30", title: "Grave Construction 30", category: "Luxury", image: "images/catalog-30.jpg" },
      { id: 31, refId: "IFH-31", title: "Grave Construction 31", category: "Luxury", image: "images/catalog-31.jpg" },
      { id: 32, refId: "IFH-32", title: "Grave Construction 32", category: "Luxury", image: "images/catalog-32.jpg" },
      { id: 33, refId: "IFH-33", title: "Grave Construction 33", category: "Luxury", image: "images/catalog-33.jpg" },
      { id: 34, refId: "IFH-34", title: "Grave Construction 34", category: "Luxury", image: "images/catalog-34.jpg" },
      { id: 35, refId: "IFH-35", title: "Grave Construction 35", category: "Luxury", image: "images/catalog-35.jpg" },
      { id: 36, refId: "IFH-36", title: "Grave Construction 36", category: "Luxury", image: "images/catalog-36.jpg" },
      { id: 37, refId: "IFH-37", title: "Grave Construction 37", category: "Luxury", image: "images/catalog-37.jpg" },
      { id: 38, refId: "IFH-38", title: "Grave Construction 38", category: "Luxury", image: "images/catalog-38.jpg" },
      { id: 39, refId: "IFH-39", title: "Grave Construction 39", category: "Luxury", image: "images/catalog-39.jpg" },
      { id: 40, refId: "IFH-40", title: "Grave Construction 40", category: "Luxury", image: "images/catalog-40.jpg" },
      { id: 41, refId: "IFH-41", title: "Grave Construction 41", category: "Luxury", image: "images/catalog-41.jpg" },
      { id: 42, refId: "IFH-42", title: "Grave Construction 42", category: "Luxury", image: "images/catalog-42.jpg" }
    ];

    const tombstoneGrid = document.getElementById('tombstoneGrid');
    if (tombstoneGrid) {
      tombstoneItems.forEach(item => {
        const el = document.createElement('div');
        el.className = 'catalog-item';
        el.style.cursor = 'pointer'; // Indicates the item is clickable
        el.innerHTML = `
          <div class="catalog-item-img">
            <span class="img-ref-id">${item.refId}</span>
            ${item.image ? `<img src="${item.image}" alt="${item.title}" loading="lazy" />` : '<div class="image-placeholder">Image Coming Soon</div>'}
          </div>
          <div class="catalog-item-info">
            <p class="category">${item.category}</p>
            <h3>${item.title}</h3>
          </div>
        `;
        tombstoneGrid.appendChild(el);
      });
    }

    // ===== LIGHTBOX & ZOOM FUNCTIONALITY =====
    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxRefId = document.getElementById('lightboxRefId');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');
    const resetZoomBtn = document.getElementById('resetZoom');
    
    let currentZoom = 1;

    if (tombstoneGrid) {
      const items = tombstoneGrid.querySelectorAll('.catalog-item');
      items.forEach((el, index) => {
        el.addEventListener('click', () => {
          const item = tombstoneItems[index];
          lightboxImage.src = item.image;
          lightboxImage.alt = item.title;
          lightboxRefId.textContent = item.refId;
          lightboxTitle.textContent = item.title;
          currentZoom = 1;
          lightboxImage.style.transform = `scale(${currentZoom})`;
          lightboxModal.classList.add('active');
          lightboxModal.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden'; // Prevent background scrolling
        });
      });
    }

    function closeLightbox() {
      lightboxModal.classList.remove('active');
      lightboxModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      currentZoom = 1;
    }

    if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
    if (lightboxModal) {
      lightboxModal.addEventListener('click', e => {
        if (e.target === lightboxModal) closeLightbox(); // Close when clicking outside the image
      });
    }
    
    // Close on Escape key
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && lightboxModal.classList.contains('active')) {
        closeLightbox();
      }
    });

    // Zoom Controls
    if (zoomInBtn) {
      zoomInBtn.addEventListener('click', () => {
        if (currentZoom < 3) {
          currentZoom += 0.25;
          lightboxImage.style.transform = `scale(${currentZoom})`;
        }
      });
    }
    if (zoomOutBtn) {
      zoomOutBtn.addEventListener('click', () => {
        if (currentZoom > 0.5) {
          currentZoom -= 0.25;
          lightboxImage.style.transform = `scale(${currentZoom})`;
        }
      });
    }
    if (resetZoomBtn) {
      resetZoomBtn.addEventListener('click', () => {
        currentZoom = 1;
        lightboxImage.style.transform = `scale(${currentZoom})`;
      });
    }
  </script>
</body>
</html>
